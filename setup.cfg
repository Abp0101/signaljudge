[metadata]
name = signaljudge
version = attr: signaljudge.__version__
description = Auditable reconciliation of model predictions and live sports-market odds
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE
author = Abdullah
classifiers =
    Development Status :: 4 - Beta
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.12
keywords = sports, odds, prediction, reconciliation, audit

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    signaljudge = signaljudge.cli:main
